<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../site.css">
<style>
  html,body{margin:0;padding:0;background:#0E1426}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:#0E1426;color:#fff;
        font-family:'Hanken Grotesk',system-ui,sans-serif}
  .card img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%}
  .scrim{position:absolute;inset:0;
         background:linear-gradient(180deg,rgba(14,20,38,.90) 0%,rgba(14,20,38,.62) 34%,rgba(14,20,38,.18) 58%,rgba(14,20,38,.74) 100%)}
  .inner{position:absolute;inset:0;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .lock{display:flex;align-items:center;gap:16px}
  .lock img{height:54px;width:auto;display:block}
  .wm{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1}
  .wm1{font-family:'Oswald',system-ui,sans-serif;font-size:30px;font-weight:600;letter-spacing:.1175em;margin-right:-.1175em;text-transform:uppercase}
  .wm2{font-family:'Oswald',system-ui,sans-serif;font-size:16.4px;font-weight:400;letter-spacing:.285em;margin-right:-.285em;text-transform:uppercase;margin-top:.3em}
  h1{margin:0;font-size:78px;line-height:.98;font-weight:500;letter-spacing:-0.045em}
  p{margin:18px 0 0;max-width:30em;font-size:23px;line-height:1.4;color:rgba(255,255,255,.93)}
  .rule{position:absolute;left:0;right:0;bottom:0;display:flex;height:8px}
  .rule i{flex:1}
</style>
</head>
<body>
<div class="card">
  <img class="photo" src="../assets/interns-table.webp" alt="">
  <div class="scrim"></div>
  <div class="inner">
    <div class="lock">
      <img src="../assets/mark.png" alt="">
      <span class="wm"><span class="wm1">Žiburio</span><span class="wm2">Foundation</span></span>
    </div>
    <div>
      <h1>Memory.<br>Inheritance.<br>Continuity.</h1>
      <p>Carrying Lithuanian cultural memory forward — and the young people who will shape what comes next.</p>
    </div>
  </div>
  <div class="rule"><i style="background:#FDB913"></i><i style="background:#006A44"></i><i style="background:#C1272D"></i></div>
</div>
</body>
</html>
